<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Get Tacos</h2>
    <form action="http://localhost:3000/tacos" method="get">
        <input type="text" name="meat" placeholder="Enter a type of meat">
        <input type="number" name="qty" placeholder="Enter a number of meat">
        <button type="submit">Submit</button>
    </form>

    <h2>Post Tacos</h2>
    <form action="http://localhost:3000/tacos" method="post">
        <input type="text" name="meat" placeholder="Enter a type of meat">
        <input type="number" name="qty" placeholder="Enter a number of meat">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
